<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misbaul Mode's - APK App Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b',
                        accent: '#6366f1'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex flex-col">
    <header class="sticky top-0 z-40 bg-darkBg/90 border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="resetFilters()">
                <div class="w-12 h-12 rounded-2xl bg-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-gamepad text-white text-2xl"></i>
                </div>
                <div>
                    <span class="text-2xl font-extrabold tracking-tight text-white">Misbaul Mode's</span>
                    <span class="block text-xs font-medium text-indigo-400">APK APP STORE</span>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="triggerAdmin()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-xl font-semibold text-sm shadow-lg shadow-indigo-600/30 transition-all flex items-center space-x-2">
                    <i class="fa-solid fa-lock"></i>
                    <span>Admin Upload</span>
                </button>
            </div>
        </div>
    </header>
    
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8">
        <div class="bg-gradient-to-r from-indigo-900/50 to-slate-900 border border-slate-800 p-8 rounded-3xl mb-10 shadow-2xl">
            <h1 class="text-3xl md:text-5xl font-extrabold mb-4 text-white">Discover & Share APKs</h1>
            <p class="text-slate-300 mb-6">Explore top-rated apps and games. Secure downloads instantly.</p>
            <button onclick="triggerAdmin()" class="bg-white text-slate-950 font-bold px-6 py-3 rounded-xl shadow-lg flex items-center space-x-2 text-sm">
                <i class="fa-solid fa-lock text-indigo-600"></i>
                <span>Admin Upload Panel</span>
            </button>
        </div>

        <div class="mb-6 flex justify-between items-center">
            <h2 class="text-xl font-bold text-white">App Library</h2>
            <span id="appCountBadge" class="text-xs text-slate-400 bg-cardBg px-3 py-1 rounded-full border border-slate-800">0 Apps</span>
        </div>

        <div id="appsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <!-- Upload Modal -->
    <div id="uploadModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 hidden p-4">
        <div class="bg-cardBg border border-slate-700 rounded-3xl max-w-lg w-full p-6 relative">
            <button onclick="closeModal()" class="absolute top-6 right-6 text-slate-400 hover:text-white">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            <h3 class="text-xl font-bold text-white mb-4">Admin Upload New APK</h3>
            <form onsubmit="saveApp(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">App Name</label>
                    <input type="text" id="appName" required class="w-full px-4 py-2.5 bg-darkBg border border-slate-700 rounded-xl text-sm text-slate-200">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Developer / Author</label>
                    <input type="text" id="appDev" required class="w-full px-4 py-2.5 bg-darkBg border border-slate-700 rounded-xl text-sm text-slate-200">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Category</label>
                    <select id="appCategory" class="w-full px-4 py-2.5 bg-darkBg border border-slate-700 rounded-xl text-sm text-slate-200">
                        <option value="Games">Games</option>
                        <option value="Tools">Tools</option>
                        <option value="Social">Social</option>
                        <option value="Entertainment">Entertainment</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Version & Size (e.g. v1.0, 30 MB)</label>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="appVersion" placeholder="v1.0" required class="px-4 py-2.5 bg-darkBg border border-slate-700 rounded-xl text-sm text-slate-200">
                        <input type="text" id="appSize" placeholder="30 MB" required class="px-4 py-2.5 bg-darkBg border border-slate-700 rounded-xl text-sm text-slate-200">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">App Icon URL</label>
                    <input type="url" id="appIcon" placeholder="https://..." required class="w-full px-4 py-2.5 bg-darkBg border border-slate-700 rounded-xl text-sm text-slate-200">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Download Link / APK URL</label>
                    <input type="url" id="appLink" placeholder="https://..." required class="w-full px-4 py-2.5 bg-darkBg border border-slate-700 rounded-xl text-sm text-slate-200">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Description</label>
                    <textarea id="appDesc" rows="2" required class="w-full px-4 py-2.5 bg-darkBg border border-slate-700 rounded-xl text-sm text-slate-200"></textarea>
                </div>
                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl text-sm">Cancel</button>
                    <button type="submit" class="px-5 py-2 bg-indigo-600 text-white rounded-xl text-sm font-semibold">Publish</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const PASSWORD = "misbaul123";
        let apps = JSON.parse(localStorage.getItem('misbaul_apps')) || [
            { id: 1, name: "Cyber Runner Mod", dev: "Misbaul", category: "Games", version: "v2.1", size: "88 MB", icon: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=150", link: "#", desc: "Action packed cyber game with unlimited mods.", downloads: "1.2K" }
        ];

        function render() {
            const grid = document.getElementById('appsGrid');
            document.getElementById('appCountBadge').innerText = `${apps.length} Apps`;
            grid.innerHTML = apps.map(app => `
                <div class="bg-cardBg border border-slate-800 rounded-3xl p-6 flex flex-col justify-between shadow-xl">
                    <div class="flex items-center space-x-3.5 mb-4">
                        <img src="${app.icon}" class="w-14 h-14 rounded-2xl object-cover border border-slate-700">
                        <div>
                            <h3 class="font-bold text-white text-base">${app.name}</h3>
                            <p class="text-xs text-slate-400">By ${app.dev}</p>
                            <span class="inline-block mt-1 px-2 py-0.5 rounded-full text-[10px] bg-indigo-500/10 text-indigo-300 border border-indigo-500/20">${app.category}</span>
                        </div>
                    </div>
                    <p class="text-xs text-slate-400 mb-4">${app.desc}</p>
                    <div class="grid grid-cols-2 gap-2">
                        <a href="${app.link}" target="_blank" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-xl text-xs text-center flex items-center justify-center space-x-1">
                            <i class="fa-solid fa-download"></i> <span>Download</span>
                        </a>
                        <button onclick="alert('Share link copied!')" class="bg-slate-800 text-slate-200 font-semibold py-2.5 rounded-xl text-xs text-center border border-slate-700">Share</button>
                    </div>
                </div>
            `).join('');
        }

        function triggerAdmin() {
            let p = prompt("Enter Admin Password:");
            if (p === PASSWORD) {
                document.getElementById('uploadModal').classList.remove('hidden');
            } else if (p !== null) {
                alert("Wrong Password!");
            }
        }

        function closeModal() {
            document.getElementById('uploadModal').classList.add('hidden');
        }

        function saveApp(e) {
            e.preventDefault();
            const newApp = {
                id: Date.now(),
                name: document.getElementById('appName').value,
                dev: document.getElementById('appDev').value,
                category: document.getElementById('appCategory').value,
                version: document.getElementById('appVersion').value,
                size: document.getElementById('appSize').value,
                icon: document.getElementById('appIcon').value,
                link: document.getElementById('appLink').value,
                desc: document.getElementById('appDesc').value,
                downloads: '10+'
            };
            apps.unshift(newApp);
            localStorage.setItem('misbaul_apps', JSON.stringify(apps));
            closeModal();
            render();
            alert("App published successfully!");
        }

        window.onload = render;
    </script>
</body>
    </html>
